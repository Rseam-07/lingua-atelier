name: Cross-platform contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m pip install fastapi==0.146.0 python-multipart==0.0.32 numpy httpx
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm run build
      - run: npm run test:portable
